base_url: https://app.yoodli.ai/api
authentication:
  style: bearer-api-key
  header: 'Authorization: Bearer <API key>'
  scheme: BearerAuth (http/bearer in components.securitySchemes)
  key_prefix: null
  issuance: 'Created in the Yoodli app: Admin view -> Org Settings -> "Access and SSO" -> "Organization Management
    API" -> Manage -> Create API key. Multi Org keys: Org Settings -> "Manage Multi Org" -> Settings -> Access ->
    "Multi Org Management API".'
  roles:
  - Organization Administrator
  - Organization Owner
  - Multi Org Administrator
  max_keys: 3
  expiry: Expiration date chosen at creation, or "Never expires"
  shown_once: true
  docs: https://developers.yoodli.ai/docs/api-keys
idempotency:
  coverage: none
  header: null
  retention: null
  note: 'Yoodli documents no idempotency key and the OpenAPI declares no Idempotency-Key parameter on any of the
    7 mutating operations. The bulk write operations (POST users, POST users/remove, PATCH members/expiration, POST
    hubs/{hubId}/users/remove) return 207 Multi-Status with a per-email result, which makes a partial failure legible
    and a retry semantically safe for those four because they are set-membership operations and therefore naturally
    idempotent by outcome — but that is a property of the resource, not a replay-protection contract the provider
    offers. POST /v3/orgs/{orgId}/hubs (Create a User Group) is NOT naturally idempotent: a retried call creates
    a second User Group.'
  evidence: no parameter matching /idempoten/i in openapi/yoodli-api-openapi.yml
pagination:
  style: offset
  params:
    start: Start index of the list; 0 if omitted
    limit: Maximum elements per page; default 20, maximum 1000
  sort_param: sort (name/-name/email/-email and date fields; leading "-" = descending)
  filter_params:
