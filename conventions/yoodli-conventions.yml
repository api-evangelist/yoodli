error_envelope:
  shape: '{"error": "<developer message>", "code": "<error code>"}'
  schema: components.schemas.ErrorResponse
  required:
  - error
  problem_json: false
  note: Bespoke envelope, not RFC 9457 application/problem+json. "error" is explicitly documented as developer-facing
    and untranslated; "code" is optional and only some failures carry it.
bulk_semantics:
  status: 207
  limits:
    add_or_invite_users: 20
    remove_users: 100
    remove_hub_users: 100
    member_expiration: 100
  note: Bulk operations return 207 Multi-Status with a per-email result rather than failing the batch.
rate_limit_signaling:
  documented_headers: []
  status_on_exhaustion: 429
  see: rate-limits/yoodli-rate-limits.yml
reversibility:
  grade: documented
  note: Yoodli publishes reversal paths for its membership writes but states no time window for any of them, so
    this grades documented rather than verified. No window is asserted here that the docs do not state.
  write_surfaces:
  - operation: POST /v3/orgs/{orgId}/users
    action: Add or invite users to an Organization / User Groups
    reversal: POST /v3/orgs/{orgId}/users/remove (removes members and deletes pending invites)
    window: null
    window_documented: false
    docs: https://developers.yoodli.ai/docs/managing-organization-users
  - operation: POST /v3/orgs/{orgId}/hubs
    action: Create a User Group
    reversal: DELETE /v3/orgs/{orgId}/hubs/{hubId}
    window: null
    window_documented: false
    docs: https://developers.yoodli.ai/docs/managing-user-groups
  - operation: DELETE /v3/orgs/{orgId}/hubs/{hubId}
    action: Delete a User Group
    reversal: null
    window: null
    window_documented: false
    note: 'Not reversible. The blast radius is controlled at call time instead, by the transfer query parameter:
      transfer=true moves members who belonged only to the deleted group into the default User Group; transfer=false
      (or omitted) removes them from the Organization entirely. An agent should treat transfer=false as destructive.
      The default User Group cannot be deleted at all.'
  - operation: PATCH /v3/orgs/{orgId}/members/expiration
    action: Set membership expiration
    reversal: 'PATCH /v3/orgs/{orgId}/members/expiration with expiration_date: null (clears it)'
    window: null
    window_documented: false
  - operation: PATCH /v3/orgs/{orgId}/hubs/{hubId}
    action: Rename a User Group
    reversal: PATCH the same operation with the previous name
    window: null
    window_documented: false
  - operation: PATCH /v3/enterprises/{enterpriseId}/orgs/{orgId}
    action: Change Multi Org seat allocation
    reversal: PATCH the same operation with the previous allocation
    window: null
    window_documented: false
    note: 'Guarded rather than reversible: a reduction below current usage is rejected with 409.'
  - operation: POST /v3/orgs/{orgId}/users/remove
    action: Remove users / delete pending invites
    reversal: POST /v3/orgs/{orgId}/users (re-invite); the removed users' history is not restored by it
    window: null
    window_documented: false
