aid: yoodli
name: Yoodli
description: >-
  Yoodli is a Seattle-based AI communication coaching company, founded in 2021 by former Google
  engineers and spun out of the Allen Institute for AI incubator. Its platform runs AI roleplays
  and speech analysis so sales, leadership, L&D and customer-facing teams can rehearse high-stakes
  conversations — pitches, interviews, performance reviews, discovery calls — and get private,
  rubric-scored feedback on filler words, pacing, and content. Yoodli publishes a REST API
  (OpenAPI 3.1.0, base https://app.yoodli.ai/api) for administrative programmatic access: managing
  Organization members, User Groups (hubs), invites and membership expirations, Multi Org seat
  allocation, and downloading a recording's rubric goal scores, coaching feedback, reviewer
  comments and transcript. It also ships a Web Embed API (iframe + postMessage) for embedding
  Yoodli activities in a host application, and a remote MCP server over its ReadMe developer portal.
