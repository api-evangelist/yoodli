  description: >-
    Yoodli's public REST API (OpenAPI 3.1.0, 13 operations) for administrative programmatic access
    to the platform — listing, inviting and removing Organization members, creating, updating and
    deleting User Groups, reading Organization and Multi Org details, adjusting Multi Org seat
    allocation, setting membership expiration dates, and downloading a recording's feedback
    (rubric goal scores, coaching feedback, reviewer comments, transcript). Bearer API-key auth;
