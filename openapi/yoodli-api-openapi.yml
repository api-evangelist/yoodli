                type: string
                description: The comment text.
            required:
            - commenter_name
            - date
            - timestamp_seconds
            - comment
          description: Reviewer/user comments. Present only when the `user_comments` section is requested.
        transcript:
          type: array
          items:
            type: object
            properties:
              speaker_id:
                examples:
                - 0
                oneOf:
                - type: number
                - type: 'null'
                description: "ID of the person who said this line, matching a key in the `speakers` map, or null\n when the\
                  \ line was spoken by the AI. `speaker_name` always gives the display name."
              speaker_name:
                examples:
                - Alex Rivera
                type: string
                description: Display name of the speaker for this line.
              start_seconds:
                examples:
                - 12.3
                type: number
                description: Line start offset from the beginning of the recording, in seconds.
              end_seconds:
                examples:
                - 15.8
                type: number
                description: Line end offset from the beginning of the recording, in seconds.
              text:
                examples:
                - Thanks for taking the time to meet with me today.
                type: string
                description: Transcribed text of the line.
            required:
            - speaker_id
            - speaker_name
            - start_seconds
            - end_seconds
            - text
          description: Transcript lines. Present only when the `transcript` section is requested.
      required:
      - version
      - exported_at
      - recording
      - speakers
      - coaching_feedback_hidden
      - coaching_feedback_override_message
    RTOrgRole:
      type: string
      enum:
      - org_owner
      - org_admin
