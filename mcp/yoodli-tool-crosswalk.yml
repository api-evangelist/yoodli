finding: Yoodli's MCP presence is real and callable but it is a documentation server, not an agent surface over
  the product. An agent connecting to https://developers.yoodli.ai/mcp can read the Yoodli API spec and fire raw
  HTTP through a proxy tool; it cannot ask for "the members of this org" as a typed tool call. The 13 operations
  are reachable but none is named, so the gap between the two surfaces is the whole product.
