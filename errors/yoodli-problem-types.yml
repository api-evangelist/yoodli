code_registry:
  published: false
  note: Yoodli documents an optional "code" field but publishes no registry of its values, and none of the 4xx responses
    in the spec enumerate codes or carry examples. An agent cannot branch on a known error code set; it can only
    branch on HTTP status and read the untranslated "error" string. Yoodli also does not document a 429 response
    body shape in the spec even though the rate-limit page documents 429 — no operation declares a 429 response
    at all.
